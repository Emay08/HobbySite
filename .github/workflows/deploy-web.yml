name: Deploy website

# Runs on every push to main that touches the website, or manually from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  id-token: write   # lets GitHub sign in to Azure without a stored password (OIDC)
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Unit + end-to-end tests
        run: npm test
        env:
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017/?directConnection=true

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build deployment package
        working-directory: web
        run: |
          npm ci --omit=dev
          rm -rf test
          zip -qr ../web.zip . -x '.env' '.env.*'

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: web.zip

      - name: Check the site responds
        run: |
          host=$(az webapp show -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "${{ vars.AZURE_WEBAPP_NAME }}" --query defaultHostName -o tsv)
          for i in $(seq 1 30); do
            if curl -fsS "https://$host/healthz" > /dev/null; then echo "Live at https://$host"; exit 0; fi
            sleep 10
          done
          echo "::error::https://$host/healthz did not respond after 5 minutes. Check Log stream in the Azure portal."
          exit 1
